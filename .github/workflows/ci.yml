name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      [ Clean_Architecture ]

  pull_request:
    branches:
      [ Clean_Architecture ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image
        run: |
          docker build \
            -f Api/SLMS.Api/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/slms-api:latest \
            .
      - name: Push Docker Image
        run: |
            docker push ghcr.io/${{ github.repository_owner }}/slms-api:latest