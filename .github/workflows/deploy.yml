name: Deploy to IIS

on:
  push:
    branches: [ Clean_Architecture ]

jobs:
  deploy:
  
    runs-on: self-hosted

    steps:
     
     - name: Checkout
       uses: actions/checkout@v4


     - name: Restore
       run: dotnet restore

     - name: Build
       run: dotnet build --configuration Release --no-restore

     - name: Publish
       run: dotnet publish -c Release -o C:\Deploy\slms

     - name: Stop IIS
       shell: powershell
       run: |
        Stop-WebSite "slms"
        Stop-WebAppPool "slms"

     - name: Copy Files
       shell: powershell
       run: |
        robocopy "C:\Deploy\slms" "C:\inetpub\wwwroot\slms" /MIR
         /XF appsettings.json appsettings.Development.json
        if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        if ($LASTEXITCODE -lt 8)
        {
        exit 0
        }
        exit $LASTEXITCODE
      
     - name: Start IIS
       shell: powershell
       run: |
        Start-WebAppPool -Name "slms"
        Start-WebSite -Name "slms"

       
     
