name: Deploy to IIS on Windows Server

on:
  push:
    branches: [ Clean_Architecture ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o C:\Deploy\slms

      - name: Stop IIS
      
        shell: powershell

        run: |

          Stop-WebSite "slms"

          Stop-WebAppPool "slms"
      - name: Start IIS

        shell: powershell

        run: |

            Start-WebAppPool "slms"

            Start-WebSite "slms"
