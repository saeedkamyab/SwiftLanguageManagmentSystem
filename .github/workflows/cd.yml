name: cd


on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  packages: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        shell: cmd
        run: echo %{{ secrets.GHCR_TOKEN }}